<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="logo">M</div>
            <h1>Marc-Asner</h1>
            <p>Connect with me</p>
        </div>

        <div class="links">
            <a href="https://wa.me/509XXXXXXXX" target="_blank">WhatsApp</a>
            <a href="https://www.facebook.com/TON_USERNAME" target="_blank">Facebook</a>
            <a href="https://www.tiktok.com/@TON_USERNAME" target="_blank">TikTok</a>
            <a href="https://www.instagram.com/TON_USERNAME" target="_blank">Instagram</a>
        </div>

        <div class="qr-section">
            <p>Scan to connect</p>
            <div id="qrcode"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
